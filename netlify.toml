# Env vars (set in Netlify UI): PRG_GHL_TOKEN, PRG_ADMIN_PASSWORD (Rug Manager at /admin),
# PRG_NOTIFY_EMAIL (team booking alerts), PRG_NOTIFY_NUMBERS (team SMS once A2P is live).
# Env var changes only reach functions after a redeploy.
[build]
  publish = "."
  functions = "netlify/functions"

[functions]
  node_bundler = "esbuild"
  external_node_modules = ["@netlify/blobs"]

[images]
  remote_images = [
    "https://storage.googleapis.com/pineville-rug/.*",
    "https://cdn.photoproofpro.com/.*"
  ]
